# The build of the signed APK, the same as the OMN-Go build. A push to
# master, a pull request to master and a push of a tag v* start it. Only a
# tag push makes a GitHub release. The tag has the form vYY.MM.S, and it
# must agree with appVersion in app/build.gradle.
#
# The keystore and the passwords come from the repository secrets
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. They must
# be the keystore and the passwords of the local build. Android installs an
# update only when the same key signs it. See the release section of
# README.md.
name: Build Retrace

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The keystore goes to RUNNER_TEMP, outside the checkout. Thus the
      # Docker context does not hold it, and no image layer gets it. It goes
      # to the build only as the BuildKit secret keystore.
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/retrace.keystore"

      # Dockerfile.ci holds the stages of Dockerfile.base and Dockerfile in
      # one file. See the comment at its top.
      #
      # The GitHub cache keeps the layers and the Gradle cache between two
      # runs. A runner is a new machine for each run.
      #
      # The passwords go to the build as BuildKit secrets, not as build
      # arguments. The secret ids agree with the mounts of Dockerfile.ci.
      # The export stage writes only the APK to ./artifacts.
      - name: Build and export artifacts
        run: |
          docker buildx build \
            -f Dockerfile.ci \
            --target export \
            --output type=local,dest=artifacts \
            --secret id=keystore,src="${RUNNER_TEMP}/retrace.keystore" \
            --secret id=keystore_password,env=KEYSTORE_PASSWORD \
            --secret id=key_alias,env=KEY_ALIAS \
            --secret id=key_password,env=KEY_PASSWORD \
            --cache-from type=gha,scope=retrace \
            --cache-to type=gha,mode=max,scope=retrace \
            .
          ls -la artifacts/
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/retrace.keystore"

      - name: Extract version
        id: version
        run: |
          VERSION=$(awk -F"'" '/^def appVersion/ {print $2}' app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      # A release with a tag that does not agree with the version of the APK
      # has a wrong name.
      - name: Check the tag against the version (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not agree with appVersion ${{ steps.version.outputs.version }}."
            exit 1
          fi

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Retrace ${{ steps.version.outputs.version }}
          files: |
            artifacts/retrace-v*-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
