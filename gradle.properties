# This file sets no android.useAndroidX and no android.builtInKotlin. The
# Android Gradle plugin deprecates both options, and its next major version
# removes them. Retrace has no AndroidX dependency and no Kotlin source.
# Thus the defaults of the two options have no effect on the APK.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
