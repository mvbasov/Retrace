# This file sets no android.useAndroidX and no android.builtInKotlin. The
# Android Gradle plugin deprecates both options, and its next major version
# removes them. Retrace has no AndroidX dependency. Thus the AndroidX default
# has no effect. app/build.gradle turns off the Kotlin support of the plugin.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
