# Retrace uses no AndroidX library. The Android Gradle plugin sets true when
# this line is absent. Thus the line stays.
android.useAndroidX=false
# Retrace has no Kotlin source. The plugin then adds no Kotlin support.
android.builtInKotlin=false
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
