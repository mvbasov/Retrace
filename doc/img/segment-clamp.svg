<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <title>The three cases of the projection: before A, between A and B, after B</title>
  <rect x="0.5" y="0.5" width="719" height="249" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Each panel: the segment from A to B, with the line through them dotted. -->
  <g transform="translate(0,0)">
    <text x="120" y="32" text-anchor="middle" font-weight="bold">f &lt; 0 → f = 0</text>
    <line x1="10" y1="160" x2="230" y2="160" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 5"/>
    <line x1="100" y1="160" x2="210" y2="160" stroke="#1e6fd9" stroke-width="5" stroke-linecap="round"/>
    <line x1="45" y1="160" x2="45" y2="85" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="45" cy="160" r="4" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <line x1="45" y1="85" x2="100" y2="160" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 4"/>
    <circle cx="100" cy="160" r="6" fill="#ffffff" stroke="#c62828" stroke-width="3"/>
    <circle cx="210" cy="160" r="6" fill="#1e6fd9" stroke="#fff" stroke-width="2"/>
    <circle cx="45" cy="85" r="8" fill="#e8710a" stroke="#fff" stroke-width="2"/>
    <text x="30" y="72" font-weight="bold">P</text>
    <text x="94" y="188" font-weight="bold">A = Q</text>
    <text x="203" y="188" font-weight="bold">B</text>
    <text x="120" y="222" text-anchor="middle" font-size="12" fill="#57606a">The nearest place is A.</text>
  </g>

  <g transform="translate(240,0)">
    <text x="120" y="32" text-anchor="middle" font-weight="bold">0 ≤ f ≤ 1</text>
    <line x1="10" y1="160" x2="230" y2="160" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 5"/>
    <line x1="40" y1="160" x2="200" y2="160" stroke="#1e6fd9" stroke-width="5" stroke-linecap="round"/>
    <line x1="130" y1="80" x2="130" y2="160" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 4"/>
    <polyline points="130,150 140,150 140,160" fill="none" stroke="#c62828" stroke-width="1.5"/>
    <circle cx="40" cy="160" r="6" fill="#1e6fd9" stroke="#fff" stroke-width="2"/>
    <circle cx="200" cy="160" r="6" fill="#1e6fd9" stroke="#fff" stroke-width="2"/>
    <circle cx="130" cy="160" r="6" fill="#ffffff" stroke="#c62828" stroke-width="3"/>
    <circle cx="130" cy="80" r="8" fill="#e8710a" stroke="#fff" stroke-width="2"/>
    <text x="115" y="67" font-weight="bold">P</text>
    <text x="33" y="188" font-weight="bold">A</text>
    <text x="123" y="188" font-weight="bold">Q</text>
    <text x="193" y="188" font-weight="bold">B</text>
    <text x="120" y="222" text-anchor="middle" font-size="12" fill="#57606a">The foot of the perpendicular.</text>
  </g>

  <g transform="translate(480,0)">
    <text x="120" y="32" text-anchor="middle" font-weight="bold">f &gt; 1 → f = 1</text>
    <line x1="10" y1="160" x2="230" y2="160" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 5"/>
    <line x1="30" y1="160" x2="140" y2="160" stroke="#1e6fd9" stroke-width="5" stroke-linecap="round"/>
    <line x1="195" y1="160" x2="195" y2="85" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="195" cy="160" r="4" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <line x1="195" y1="85" x2="140" y2="160" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 4"/>
    <circle cx="30" cy="160" r="6" fill="#1e6fd9" stroke="#fff" stroke-width="2"/>
    <circle cx="140" cy="160" r="6" fill="#ffffff" stroke="#c62828" stroke-width="3"/>
    <circle cx="195" cy="85" r="8" fill="#e8710a" stroke="#fff" stroke-width="2"/>
    <text x="203" y="72" font-weight="bold">P</text>
    <text x="23" y="188" font-weight="bold">A</text>
    <text x="122" y="188" font-weight="bold">B = Q</text>
    <text x="120" y="222" text-anchor="middle" font-size="12" fill="#57606a">The nearest place is B.</text>
  </g>
</svg>
