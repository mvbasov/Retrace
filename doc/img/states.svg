<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <title>The states of TrackMatcher and the changes between them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- The states. -->
  <rect x="30" y="40" width="130" height="44" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="95" y="67" text-anchor="middle" font-weight="bold">WAITING</text>
  <rect x="30" y="230" width="130" height="44" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="95" y="257" text-anchor="middle" font-weight="bold">AT_START</text>
  <rect x="300" y="135" width="140" height="44" rx="8" fill="#dbeafe" stroke="#1e6fd9"/>
  <text x="370" y="162" text-anchor="middle" font-weight="bold">ON_ROUTE</text>
  <rect x="470" y="262" width="140" height="44" rx="8" fill="#fde2e1" stroke="#c62828"/>
  <text x="540" y="289" text-anchor="middle" font-weight="bold">OFF_ROUTE</text>
  <rect x="560" y="135" width="130" height="44" rx="8" fill="#dcfce7" stroke="#2e7d32"/>
  <text x="625" y="162" text-anchor="middle" font-weight="bold">FINISHED</text>

  <!-- WAITING to AT_START. -->
  <line x1="95" y1="84" x2="95" y2="228" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="104" y="150" font-size="12">a fix inside</text>
  <text x="104" y="165" font-size="12">the start circle</text>

  <!-- WAITING to ON_ROUTE: the join. -->
  <path d="M160,62 C240,62 290,100 318,133" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="48" font-size="12">join: 3 fixes near the route,</text>
  <text x="200" y="63" font-size="12">away from the start</text>

  <!-- AT_START to ON_ROUTE. -->
  <path d="M160,252 C240,252 290,215 318,181" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="172" y="290" font-size="12">a fix outside</text>
  <text x="172" y="305" font-size="12">the start circle</text>

  <!-- ON_ROUTE to OFF_ROUTE and back. -->
  <line x1="410" y1="179" x2="488" y2="259" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="262" x2="452" y2="182" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="240" font-size="12" text-anchor="end">3 fixes</text>
  <text x="440" y="255" font-size="12" text-anchor="end">above the limit</text>
  <text x="525" y="212" font-size="12">2 fixes</text>
  <text x="525" y="227" font-size="12">inside the limit</text>

  <!-- ON_ROUTE to FINISHED. -->
  <line x1="440" y1="157" x2="558" y2="157" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="125" font-size="12">the finish test</text>
  <text x="452" y="140" font-size="12">is true</text>
</svg>
