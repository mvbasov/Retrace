<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222">
  <title>The way of one GPS fix from the receiver to the trip screen</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="249" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- The first row: the service thread. -->
  <text x="20" y="30" font-size="12" fill="#57606a">TrackService, the worker thread</text>
  <rect x="20" y="45" width="120" height="50" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="80" y="66" text-anchor="middle" font-weight="bold">GPS fix</text>
  <text x="80" y="83" text-anchor="middle" font-size="12">once each second</text>

  <rect x="190" y="45" width="140" height="50" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="260" y="66" text-anchor="middle" font-weight="bold">RecordFilter</text>
  <text x="260" y="83" text-anchor="middle" font-size="12">accuracy, step</text>

  <rect x="380" y="45" width="140" height="50" rx="8" fill="#dbeafe" stroke="#1e6fd9"/>
  <text x="450" y="66" text-anchor="middle" font-weight="bold">TrackMatcher</text>
  <text x="450" y="83" text-anchor="middle" font-size="12">update(point)</text>

  <rect x="570" y="45" width="130" height="50" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="635" y="66" text-anchor="middle" font-weight="bold">MatchResult</text>
  <text x="635" y="83" text-anchor="middle" font-size="12">s, d, Δt, Δs, ghost</text>

  <line x1="140" y1="70" x2="188" y2="70" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="70" x2="378" y2="70" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="70" x2="568" y2="70" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#57606a">a dropped fix stops here</text>

  <!-- The second row. -->
  <rect x="570" y="160" width="130" height="50" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="635" y="181" text-anchor="middle" font-weight="bold">DeltaSmoother</text>
  <text x="635" y="198" text-anchor="middle" font-size="12">smooth Δt</text>

  <rect x="380" y="160" width="140" height="50" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="450" y="181" text-anchor="middle" font-weight="bold">RecordingSnapshot</text>
  <text x="450" y="198" text-anchor="middle" font-size="12">immutable</text>

  <rect x="190" y="160" width="140" height="50" rx="8" fill="#eaeef2" stroke="#8c959f"/>
  <text x="260" y="181" text-anchor="middle" font-weight="bold">RunActivity</text>
  <text x="260" y="198" text-anchor="middle" font-size="12">trip screen, each 1 s</text>

  <line x1="635" y1="95" x2="635" y2="158" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="185" x2="522" y2="185" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="185" x2="332" y2="185" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="20" y="182" font-size="12" fill="#57606a">the UI thread reads</text>
  <text x="20" y="198" font-size="12" fill="#57606a">the last snapshot</text>
</svg>
